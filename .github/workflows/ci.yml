name: test

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install TeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk poppler-utils texlive-xetex texlive-latex-extra fonts-noto-cjk
      - name: Run unit and compile tests
        run: python3 -m unittest discover -s tests -v
